# Prompt definitions for TLG.
#
# Editing policy:
# - Keep prompts short and unambiguous.
# - Prefer explicit output constraints (e.g., "Answer with only YES/NO").
# - Only define prompts that have reliable supervision in at least one dataset.
#
# Dataset-to-prompt assignment lives in `dataset_prompts.yaml`.

target_region_bbox_prompt:
  question: "The target region is inside the red bounding box. Answer only about that boxed region and ignore all other regions.\n\n"

liquid_presence:
  task_type: "Liquid Presence Detection (binary)"
  question: "Does the container contain any liquid? Answer with only 'YES' or 'NO'."
  choices: ["YES", "NO"]

fill_percentage:
  task_type: "Fill-Level Estimation (continuous)"
  question: "Estimate the liquid fill level as a percentage (0-100). Answer with only a number between 0 and 100."

fill_level_ordinal:
  task_type: "Fill-Level Estimation (ordinal)"
  question: "What is the fill level of liquid in this container? Choose exactly one: EMPTY, LOW, MID, HIGH, or FULL."
  choices: ["EMPTY", "LOW", "MID", "HIGH", "FULL"]

container_type:
  task_type: "Container Type Recognition (classification)"
  question: "Identify the container type. Choose exactly one: Tube_50mL, Tube_15mL, Pyrex_100mL, StorageBottle_250mL, StorageBottle_500mL, Duran_500mL, Duran_250mL, Cell_Flask_160mL, Cell_Flask_400mL, Duran_100mL, Gibco_125mL, Gibco_500mL, T25 Flask, T75 Flask, T175 Flask, G-rex, or Tip."
  choices: ["Tube_50mL", "Tube_15mL", "Pyrex_100mL", "StorageBottle_250mL", "StorageBottle_500mL", "Duran_500mL", "Duran_250mL", "Cell_Flask_160mL", "Cell_Flask_400mL", "Duran_100mL", "Gibco_125mL", "Gibco_500mL", "T25 Flask", "T75 Flask", "T175 Flask", "G-rex", "Tip"]

container_count:
  task_type: "Container Counting (discrete)"
  question: "How many liquid containers are visible in the image? Answer with only an integer (0 or greater)."

fill_height_mm:
  task_type: "Fill-Level Estimation (height_mm)"
  question: "Estimate liquid height in millimeters. Answer with only a number."

liquid_color:
  task_type: "Liquid Color Recognition (classification)"
  question: "What color is the liquid? Answer with a single color name."

tip_presence:
  task_type: "Tip Presence Detection (binary)"
  question: "Is there a pipette tip visible in the image? Answer with only 'YES' or 'NO'."
  choices: ["YES", "NO"]

liquid_grounding:
  task_type: "Liquid Visual Grounding (bbox)"
  question: "Locate every Liquid region. Use coordinates normalized to the 0-1000 image scale. Return only valid JSON in this exact format: [{\"bbox_2d\":[x1,y1,x2,y2],\"label\":\"Liquid\"}]."

highlighted_region_type:
  task_type: "Lab Region Type Recognition (classification)"
  question: "What is the region inside the red bounding box? Choose exactly one: VESSEL, LIQUID, FOAM, GEL, SOLID, POWDER, GRANULAR, VAPOR, or BACKGROUND."
  choices: ["VESSEL", "LIQUID", "FOAM", "GEL", "SOLID", "POWDER", "GRANULAR", "VAPOR", "BACKGROUND"]

material_types_present:
  task_type: "Material Type Presence (multi-label)"
  question: "Which material types are present in the image? Choose all that apply from: LIQUID, FOAM, GEL, SOLID, POWDER, GRANULAR, VAPOR, NONE. Answer with only a comma-separated list."
  choices: ["LIQUID", "FOAM", "GEL", "SOLID", "POWDER", "GRANULAR", "VAPOR", "NONE"]

multiphase_material_presence:
  task_type: "Multi-Phase Material Presence Detection (binary)"
  question: "Does the image contain a multi-phase material? Answer with only 'YES' or 'NO'."
  choices: ["YES", "NO"]

pouring_change_detection:
  task_type: "Liquid Change Detection (pairwise)"
  question: "Compare the first image to the second image. How did the amount of visible liquid change from the first image to the second image? Answer with only one of: NO_CHANGE, LIQUID_INCREASED, LIQUID_DECREASED."
  choices: ["NO_CHANGE", "LIQUID_INCREASED", "LIQUID_DECREASED"]
