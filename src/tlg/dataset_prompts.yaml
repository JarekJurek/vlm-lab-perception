# Dataset -> included prompts/tasks.
#
# Most datasets can be a simple list: each entry is a task name and also the
# default prompt_id (prompt_id == task).
#
# If a dataset needs dataset-specific wording or constrained choices for a task,
# use the mapping form with an `overrides` block. If a task needs an additional
# reusable instruction prefix, add it under `task_prompt_prefixes`.

labliquidvision:
  - fill_percentage
  - fill_level_ordinal
  - container_capacity_ml
  - container_capacity_bin
  - container_count
  - container_type
  - container_type_simple
  - liquid_color
  - liquid_grounding

glasses:
  - fill_percentage
  - fill_level_ordinal

dtld:
  include:
    - container_count
    - container_type
    - container_type_simple
    - fill_height_mm
  task_prompt_prefixes:
    container_type:
      - target_region_bbox_prompt
    container_type_simple:
      - target_region_bbox_prompt
    fill_height_mm:
      - target_region_bbox_prompt

labpics_chemistry:
  include:
    - highlighted_region_type
    - material_types_present
    - multiphase_material_presence
    - liquid_grounding
    - container_count
    - container_type
  overrides:
    container_type: labpics_chemistry_container_type
  task_prompt_prefixes:
    container_type:
      - target_region_bbox_prompt

ot2:
  include:
    - liquid_grounding
    - fill_percentage
    - fill_level_ordinal
    - tip_presence
    - container_count
    - container_type
    - container_type_simple
    - liquid_color
  task_prompt_prefixes:
    fill_percentage:
      - pipette_tip_group_context_prompt
    container_type:
      - pipette_tip_group_context_prompt
    container_type_simple:
      - pipette_tip_group_context_prompt
    fill_level_ordinal:
      - pipette_tip_group_context_prompt
pouring:
  - pouring_frame_ordering
  - liquid_grounding
  - liquid_color

coqe:
  include:
    - container_capacity_ml
    - container_capacity_bin
    - fill_level_ordinal
    - liquid_transfer_feasibility
  task_prompt_prefixes:
    container_capacity_ml:
      - target_region_bbox_prompt
    container_capacity_bin:
      - target_region_bbox_prompt
    fill_level_ordinal:
      - target_region_bbox_prompt
    liquid_transfer_feasibility:
      - source_target_bbox_prompt
